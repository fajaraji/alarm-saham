# CI Alarm Saham — gerbang otomatis pada setiap push & pull request.
#
#   verify   lint, typecheck, tes unit/integrasi (Vitest), build produksi
#   e2e      Playwright: alur 1→2→3 (smoke) + axe-core 6 halaman × 2 mode tema
#   rahasia  pemindai pola kunci/kredensial pada SELURUH riwayat git
#
# TIDAK ADA job yang butuh kunci API, DATABASE_URL, Docker, atau folder ./.pglite:
# runner memakai jalur fixture dan PGlite in-memory, nol panggilan Sectors/LLM.
# Kalau salah satu job di sini butuh rahasia, gerbangnya jadi tidak bisa dipakai
# kontributor lain — dan aturan lomba (c) melarang rahasia masuk repo.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Tes integrasi skema memakai PGlite in-memory. Tanpa baris ini ia memilih
      # jalur Docker (daemon memang tersedia di runner) dan menarik image
      # postgres:16 dari Docker Hub setiap run — ketergantungan jaringan luar dan
      # rate limit IP bersama, di gerbang yang seharusnya deterministik.
      ALARM_TEST_DB: pglite
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Smoke & aksesibilitas (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Runner tidak punya ./.pglite (folder itu di-gitignore, tidak pernah
      # ter-commit). E2E_TANPA_PGLITE=1 membuat pilihan itu eksplisit: server
      # dijalankan pada jalur fixture dan spec yang menuntut data nyata di-skip
      # dengan pesan, bukan gagal (tests/e2e/util.ts).
      E2E_TANPA_PGLITE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependensi
        run: npm ci

      # Hanya chromium: satu peramban cukup untuk smoke + axe, dan unduhannya
      # jauh lebih ringan daripada tiga mesin peramban.
      - name: Pasang peramban Playwright
        run: npx playwright install --with-deps chromium

      # webServer di playwright.config.ts menjalankan `npm run build && npm run start`.
      - name: E2E
        run: npm run test:e2e

      - name: Simpan laporan Playwright bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rahasia:
    name: Pemindai rahasia (seluruh riwayat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (riwayat penuh)
        uses: actions/checkout@v5
        with:
          # Pemindai membaca SEMUA commit, bukan hanya HEAD: kunci yang sempat
          # ter-commit lalu dihapus tetap terbaca dari riwayat repo publik.
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Tanpa `npm ci`: scripts/scan-history.mjs sengaja nol dependensi, hanya
      # Node + git, supaya gerbang rahasia tidak ikut jatuh bila registry npm
      # sedang bermasalah.
      - name: Pindai rahasia di seluruh riwayat
        run: npm run scan:history
